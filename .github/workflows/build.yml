name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Create Flutter project
        run: |
          flutter create --org com.atlaspro --project-name atlaspro temp_app
          cp -r temp_app/android .
          cp -r temp_app/ios . 2>/dev/null || true
          rm -rf temp_app
      - name: Copy source files
        run: |
          cp -r lib/* temp_lib/ 2>/dev/null || true
          rm -rf android/app/src/main/kotlin/com/atlaspro/atlaspro/MainActivity.kt 2>/dev/null || true
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
