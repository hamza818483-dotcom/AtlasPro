name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: Patch Flutter v1 embedding check
        run: |
          # Find all Flutter tools dart files that contain the v1 embedding error
          FILES=$(find /opt/hostedtoolcache/flutter -name "*.dart" -path "*/flutter_tools/*" -exec grep -l "deleted Android v1 embedding" {} \; 2>/dev/null)
          if [ -n "$FILES" ]; then
            for FILE in $FILES; do
              echo "Patching: $FILE"
              # Use perl for multiline-safe replacement (throwToolExit spans multiple lines in source)
              perl -i -0pe 's/throwToolExit\([^;]*deleted Android v1 embedding[^;]*\);//gs' "$FILE"
            done
            # Delete compiled snapshots so Flutter rebuilds from the patched source
            find /opt/hostedtoolcache/flutter -name "flutter_tools.snapshot" -delete 2>/dev/null && echo "Deleted snapshot" || echo "No snapshot found"
            find /opt/hostedtoolcache/flutter -name "flutter_tools.dill" -delete 2>/dev/null && echo "Deleted dill" || echo "No dill found"
            echo "Patch complete"
          else
            echo "Warning: v1 embedding check not found in Flutter tools source"
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
