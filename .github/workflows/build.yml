name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: Patch Flutter v1 embedding check
        run: |
          FILE=$(find /opt/hostedtoolcache/flutter -name "project.dart" -path "*/flutter_tools/*" | head -1)
          sed -i "s/throwToolExit('Build failed due to use of deleted Android v1 embedding.', exitCode: 1);/\/\/ v1 check disabled/g" "$FILE"
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
