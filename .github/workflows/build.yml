name: Build APK & Deploy Web
on: [push]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: Patch Flutter v1 embedding check
        run: |
          FILES=$(find /opt/hostedtoolcache/flutter -name "*.dart" -path "*/flutter_tools/*" -exec grep -l "deleted Android v1 embedding" {} \; 2>/dev/null)
          if [ -n "$FILES" ]; then
            for FILE in $FILES; do
              echo "Patching: $FILE"
              perl -i -0pe 's/throwToolExit\([^;]*deleted Android v1 embedding[^;]*\);//gs' "$FILE"
            done
            find /opt/hostedtoolcache/flutter -name "flutter_tools.snapshot" -delete 2>/dev/null && echo "Deleted snapshot" || echo "No snapshot found"
            find /opt/hostedtoolcache/flutter -name "flutter_tools.dill" -delete 2>/dev/null && echo "Deleted dill" || echo "No dill found"
            echo "Patch complete"
          else
            echo "Warning: v1 embedding check not found in Flutter tools source"
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build web --release --base-href /
      - name: Create Cloudflare Pages project if not exists
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"atlaspro","production_branch":"main"}' || true
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: atlaspro
          directory: build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
