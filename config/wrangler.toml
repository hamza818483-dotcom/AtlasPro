# wrangler.toml — AtlasPro Cloudflare Config
# Deploy: npx wrangler deploy

name = "atlaspro-main"
main = "workers/main-worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "atlaspro-db"
database_id = "YOUR_D1_DATABASE_ID"

# R2 Storage
[[r2_buckets]]
binding = "R2"
bucket_name = "atlaspro-files"

# Environment Variables (set via: npx wrangler secret put GEMINI_KEY)
[vars]
R2_PUBLIC_DOMAIN = "files.yourdomain.workers.dev"

# Routes
[[routes]]
pattern = "api.atlaspro.workers.dev/*"
zone_name = "workers.dev"

# ─── Auth Worker ───────────────────────────────────────────
# Deploy separately: npx wrangler deploy --config wrangler.auth.toml
