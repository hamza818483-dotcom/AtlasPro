<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রোফাইল — AtlasPro</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ── Profile Avatar ── */
.profile-hero {
  background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(196,181,253,0.08));
  border-bottom: 1px solid var(--border);
  padding: 24px 14px 20px;
  text-align: center;
}
.profile-avatar-big {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: var(--primary-light);
  border: 3px solid var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 900; color: var(--primary);
  margin: 0 auto 12px;
  box-shadow: 0 0 24px rgba(108,99,255,0.3);
}
.profile-name { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
.profile-batch { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
.profile-badges { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.profile-badge {
  font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px;
}
.pb-free    { background: rgba(99,179,237,0.15); color: #63B3ED; }
.pb-premium { background: rgba(245,158,11,0.15);  color: var(--amber); }
.pb-batch   { background: rgba(108,99,255,0.12);  color: var(--accent); }
.pb-college { background: rgba(16,185,129,0.12);  color: var(--green); }

/* ── Stats Row ── */
.stats-row {
  display: flex;
  border-bottom: 1px solid var(--border);
}
.stat-item {
  flex: 1; padding: 14px 8px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat-item:last-child { border-right: none; }
.stat-val { font-size: 22px; font-weight: 900; color: var(--primary); }
.stat-lbl { font-size: 9px; color: var(--text3); font-weight: 600; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

/* ── Edit Form ── */
.edit-section {
  margin: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.edit-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.edit-header-title { font-size: 14px; font-weight: 700; }
.edit-body { padding: 14px; display: none; }
.edit-body.open { display: block; }
.form-group { margin-bottom: 12px; }
.form-label { font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 5px; display: block; }
.form-input {
  width: 100%; height: 44px;
  background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 0 12px;
  font-size: 14px; color: var(--text); outline: none;
  transition: border-color 0.2s; font-family: inherit;
}
.form-input:focus { border-color: var(--primary); }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }
.form-actions { display: flex; gap: 8px; margin-top: 4px; }

/* ── Exam History ── */
.section-wrap { padding: 14px; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.history-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 8px;
  cursor: pointer; transition: all 0.2s;
  animation: fadeUp 0.3s ease both;
}
.history-card:hover { border-color: var(--primary); transform: translateX(2px); }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.history-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.history-name { font-size: 13px; font-weight: 700; line-height: 1.4; }
.history-date { font-size: 10px; color: var(--text3); white-space: nowrap; }
.history-score { font-size: 18px; font-weight: 900; color: var(--primary); }
.history-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.hbadge {
  font-size: 10px; font-weight: 700; padding: 2px 7px;
  border-radius: 20px; display: inline-flex; align-items: center; gap: 3px;
}
.hb-correct { background: rgba(16,185,129,0.12); color: var(--green); }
.hb-wrong   { background: rgba(239,68,68,0.12);  color: var(--red);   }
.hb-skip    { background: rgba(255,255,255,0.06); color: var(--text3); }

/* ── Mistake Practice ── */
.mistake-btn {
  width: calc(100% - 28px); margin: 0 14px 14px;
  height: 50px; border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(239,68,68,0.12), rgba(245,158,11,0.1));
  border: 1.5px solid rgba(239,68,68,0.3);
  color: var(--red); font-size: 14px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.mistake-btn:hover { background: rgba(239,68,68,0.18); border-color: var(--red); }

/* ── Logout ── */
.logout-btn {
  width: calc(100% - 28px); margin: 0 14px 20px;
  height: 46px; border-radius: var(--radius);
  background: rgba(239,68,68,0.08); border: 1.5px solid rgba(239,68,68,0.2);
  color: var(--red); font-size: 14px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.logout-btn:hover { background: rgba(239,68,68,0.14); }

/* Skeleton */
.skel { background: linear-gradient(90deg, var(--border) 25%, var(--card-hover) 50%, var(--border) 75%); background-size:200% 100%; animation: shimmer 1.4s ease infinite; border-radius:6px; }
@keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
.skel-card { height:90px; border-radius:var(--radius); margin-bottom:8px; }
</style>
</head>

<script>
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
function closeSidebar()  { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }
function showToast(msg, d=2500) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),d); }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleEdit() {
  const body = document.getElementById('editBody');
  const icon = document.getElementById('editToggleIcon');
  const open = body.classList.toggle('open');
  icon.style.transform = open ? 'rotate(180deg)' : '';
}

let profileData = {};

async function loadProfile() {
  const name      = Auth.getUserName();
  const isPremium = localStorage.getItem('is_premium') === 'true';
  const isAdmin   = Auth.isAdmin();
  const initial   = name ? name[0].toUpperCase() : 'A';

  document.getElementById('avatarBtn').textContent     = initial;
  document.getElementById('sidebarAvatar').textContent = initial;
  document.getElementById('sidebarName').textContent   = name || 'Guest';
  document.getElementById('profileAvatar').textContent = initial;
  if (isPremium) {
    const b = document.getElementById('sidebarBadge');
    b.className = 'sidebar-badge badge-premium'; b.textContent = '⭐ Premium';
  }
  if (isAdmin) document.getElementById('adminLink').style.display = 'flex';

  if (!Auth.isLoggedIn()) {
    document.getElementById('profileName').textContent = 'Guest';
    document.getElementById('profileBatch').textContent = 'লগইন করোনি';
    document.getElementById('historyArea').innerHTML = `<div class="empty"><div class="empty-icon">🔐</div><div class="empty-title">লগইন দরকার</div><div class="empty-text">ইতিহাস দেখতে লগইন করো</div><a href="auth.html" class="btn btn-primary" style="margin-top:12px">লগইন করো</a></div>`;
    return;
  }

  try {
    const res = await Auth.api('/api/user/profile');
    if (res.ok) {
      const data = await res.json();
      profileData = data;
      document.getElementById('profileName').textContent  = data.name || name;
      document.getElementById('profileBatch').textContent = data.college || '';
      const badges = [];
      if (data.batch)   badges.push(`<span class="profile-badge pb-batch">HSC ${data.batch}</span>`);
      if (data.college) badges.push(`<span class="profile-badge pb-college">${escHtml(data.college)}</span>`);
      badges.push(isPremium ? '<span class="profile-badge pb-premium">⭐ Premium</span>' : '<span class="profile-badge pb-free">🆓 Free</span>');
      document.getElementById('profileBadges').innerHTML = badges.join('');

      document.getElementById('editName').value    = data.name || '';
      document.getElementById('editBatch').value   = data.batch || '';
      document.getElementById('editCollege').value = data.college || '';
      document.getElementById('editSsc').value     = data.ssc_gpa || '';
      document.getElementById('editHsc').value     = data.hsc_gpa || '';
    }
  } catch {}

  loadStats();
  loadHistory();
}

async function loadStats() {
  try {
    const res = await Auth.api('/api/user/stats');
    if (res.ok) {
      const d = await res.json();
      document.getElementById('statExams').textContent = d.total_exams ?? '0';
      document.getElementById('statAvg').textContent   = d.avg_score != null ? d.avg_score.toFixed(1) : '—';
      document.getElementById('statBest').textContent  = d.best_score != null ? d.best_score.toFixed(1) : '—';
    }
  } catch {}
}

async function loadHistory() {
  const area = document.getElementById('historyArea');
  try {
    const res = await Auth.api('/api/user/exam-history');
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const list = data.history || [];
    document.getElementById('historyCount').textContent = `${list.length}টি`;
    if (!list.length) {
      area.innerHTML = `<div class="empty"><div class="empty-icon">📝</div><div class="empty-title">কোনো পরীক্ষা নেই</div><div class="empty-text">এখনো কোনো MCQ পরীক্ষা দাওনি</div></div>`;
      return;
    }
    area.innerHTML = list.map((h, i) => `
      <div class="history-card" style="animation-delay:${i*40}ms">
        <div class="history-top">
          <div>
            <div class="history-name">${escHtml(h.pdf_name || 'MCQ Exam')}</div>
            <div style="font-size:10px;color:var(--text3);margin-top:2px">${h.subject_name ? escHtml(h.subject_name)+' · ' : ''}${formatDate(h.created_at)}</div>
          </div>
          <div class="history-score">${h.marks ?? '—'}<span style="font-size:11px;color:var(--text3)">/${h.total ?? '—'}</span></div>
        </div>
        <div class="history-badges">
          <span class="hbadge hb-correct">✅ ${h.correct ?? 0} সঠিক</span>
          <span class="hbadge hb-wrong">❌ ${h.wrong ?? 0} ভুল</span>
          <span class="hbadge hb-skip">⏭️ ${h.skip ?? 0} বাদ</span>
        </div>
      </div>`).join('');
  } catch {
    area.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">লোড হয়নি</div><button class="btn btn-outline" onclick="loadHistory()">↻ আবার</button></div>`;
  }
}

function formatDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('bn-BD', { day:'numeric', month:'short', year:'numeric' }); } catch { return iso; }
}

async function saveProfile() {
  const body = {
    name:    document.getElementById('editName').value.trim(),
    batch:   document.getElementById('editBatch').value,
    college: document.getElementById('editCollege').value.trim(),
    ssc_gpa: parseFloat(document.getElementById('editSsc').value) || 0,
    hsc_gpa: parseFloat(document.getElementById('editHsc').value) || 0,
  };
  if (!body.name) { showToast('নাম দাও'); return; }
  try {
    const res = await Auth.api('/api/user/profile', { method:'PUT', body:JSON.stringify(body) });
    if (res.ok) {
      localStorage.setItem('user_name', body.name);
      showToast('✅ প্রোফাইল সেভ হয়েছে');
      toggleEdit();
      loadProfile();
    } else { showToast('❌ সেভ হয়নি'); }
  } catch { showToast('❌ নেটওয়ার্ক সমস্যা'); }
}

async function startMistakePractice() {
  showToast('ভুল প্রশ্ন লোড হচ্ছে...');
  try {
    const res = await Auth.api('/api/user/mistakes');
    if (!res.ok) throw new Error();
    const data = await res.json();
    const qs = data.questions || [];
    if (!qs.length) { showToast('দারুণ! কোনো ভুল নেই 🎉'); return; }
    const q = new URLSearchParams({ pdf_name:'ভুল Practice', subject_name:'আমার ভুলগুলো' });
    sessionStorage.setItem('practice_questions', JSON.stringify(qs));
    window.location.href = `exam.html?${q}&practice=1`;
  } catch { showToast('❌ লোড হয়নি'); }
}

document.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
