<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Exam — AtlasPro</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
body { padding-top: 56px; padding-bottom: 0; }

/* ── Exam Header ── */
.exam-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  z-index: 100;
}
.exam-title {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.exam-title-sub {
  font-size: 10px;
  color: var(--text3);
  font-weight: 400;
}

/* ── Timer ── */
.timer-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 6px 12px;
  flex-shrink: 0;
}
.timer-display {
  font-size: 16px;
  font-weight: 900;
  color: var(--text);
  font-family: 'Inter', monospace;
  letter-spacing: 1px;
  min-width: 48px;
  text-align: center;
}
.timer-display.warning { color: var(--amber); }
.timer-display.danger  { color: var(--red); }
.timer-icon { font-size: 14px; }

/* ── Score tracker ── */
.score-track {
  display: flex;
  gap: 12px;
  padding: 10px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.score-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  flex: 1;
}
.score-val {
  font-size: 18px;
  font-weight: 900;
}
.score-lbl {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--text3);
  text-transform: uppercase;
}
.score-correct { color: var(--green); }
.score-wrong   { color: var(--red); }
.score-skip    { color: var(--text3); }
.score-marks   { color: var(--primary); }

/* ── Progress bar ── */
.progress-bar-wrap {
  height: 3px;
  background: var(--border);
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--pink));
  transition: width 0.4s ease;
}

/* ── Question Area ── */
.question-area {
  padding: 16px 14px 180px;
}
.q-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 14px;
}
.q-num {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--primary-light);
  border: 1.5px solid rgba(108,99,255,0.35);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900;
  color: var(--primary);
  flex-shrink: 0;
}
.q-type-badge {
  font-size: 9px; font-weight: 700;
  padding: 2px 7px; border-radius: 20px;
  background: rgba(108,99,255,0.1);
  color: var(--accent);
  border: 1px solid rgba(108,99,255,0.2);
}
.q-text {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.7;
  color: var(--text);
  flex: 1;
}

/* ── Options ── */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
}
.option-btn {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.18s;
  text-align: left;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  line-height: 1.5;
  width: 100%;
}
.option-btn:hover:not(:disabled):not(.selected) {
  border-color: var(--primary);
  background: var(--primary-light);
}
.option-btn.selected {
  border-color: var(--primary);
  background: rgba(108,99,255,0.15);
}
.option-label {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg2);
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900;
  flex-shrink: 0;
  transition: all 0.18s;
}
.option-btn.selected .option-label {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.option-text { flex: 1; padding-top: 2px; }

/* ── Navigation Grid ── */
.nav-grid-wrap {
  position: fixed;
  bottom: 60px; left: 0; right: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 10px 14px;
  z-index: 90;
  max-height: 160px;
  overflow-y: auto;
}
.nav-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.nav-dot {
  width: 32px; height: 32px;
  border-radius: 8px;
  font-size: 11px; font-weight: 700;
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.nav-dot:hover { border-color: var(--primary); color: var(--primary); }
.nav-dot.answered { background: var(--primary); border-color: var(--primary); color: #fff; }
.nav-dot.current  { border-color: var(--pink); color: var(--pink); box-shadow: 0 0 0 2px rgba(244,114,182,0.3); }
.nav-dot.answered.current { background: var(--primary); border-color: var(--pink); color: #fff; }

/* ── Bottom Action Bar ── */
.exam-bottom {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 60px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  z-index: 100;
}
.btn-nav {
  height: 42px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  white-space: nowrap;
}
.btn-nav:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.btn-nav:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-skip {
  height: 42px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text3);
  font-size: 12px; font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.btn-skip:hover { color: var(--amber); border-color: var(--amber); }
.btn-submit {
  flex: 1;
  height: 42px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--green), #0A9668);
  color: #fff;
  font-size: 13px; font-weight: 700;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: opacity 0.2s;
}
.btn-submit:hover { opacity: 0.9; }

/* ── Confirm Submit Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 500;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  width: 100%;
  max-width: 360px;
  transform: translateY(20px);
  transition: transform 0.25s;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-title  { font-size: 16px; font-weight: 900; margin-bottom: 6px; }
.modal-text   { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 20px; }
.modal-stats  { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.modal-stat   {
  flex: 1; min-width: 70px;
  background: var(--bg2);
  border-radius: var(--radius-sm);
  padding: 10px;
  text-align: center;
}
.modal-stat-val { font-size: 22px; font-weight: 900; }
.modal-stat-lbl { font-size: 10px; color: var(--text3); margin-top: 2px; }
.modal-actions { display: flex; gap: 8px; }

/* ── Loading ── */
.exam-loading {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 60vh; gap: 14px;
}
.exam-loading .spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Negative marking note ── */
.negative-note {
  font-size: 10px;
  color: var(--text3);
  padding: 6px 14px;
  text-align: center;
}

/* ── Desktop centering ── */
@media (min-width: 768px) {
  .exam-header, .nav-grid-wrap, .exam-bottom {
    max-width: 600px;
    left: 50%; transform: translateX(-50%);
    right: auto; width: 600px;
  }
}
</style>
</head>
<body>

<!-- ══ EXAM HEADER ══ -->
<header class="exam-header">
  <div class="exam-title">
    <div id="examTitleMain">MCQ Exam</div>
    <div class="exam-title-sub" id="examTitleSub"></div>
  </div>
  <div class="timer-box">
    <span class="timer-icon">⏱️</span>
    <div class="timer-display" id="timerDisplay">30:00</div>
  </div>
</header>

<!-- ══ SCORE TRACKER ══ -->
<div class="score-track" id="scoreTrack">
  <div class="score-item">
    <div class="score-val score-correct" id="scoreCorrect">0</div>
    <div class="score-lbl">সঠিক</div>
  </div>
  <div class="score-item">
    <div class="score-val score-wrong" id="scoreWrong">0</div>
    <div class="score-lbl">ভুল</div>
  </div>
  <div class="score-item">
    <div class="score-val score-skip" id="scoreSkip">0</div>
    <div class="score-lbl">বাদ</div>
  </div>
  <div class="score-item">
    <div class="score-val score-marks" id="scoreMarks">0.00</div>
    <div class="score-lbl">নম্বর</div>
  </div>
</div>
<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
</div>
<div class="negative-note">প্রতিটি সঠিক উত্তর +1 | প্রতিটি ভুল উত্তর -0.25</div>

<!-- ══ QUESTION AREA ══ -->
<div class="question-area" id="questionArea">
  <div class="exam-loading" id="loadingState">
    <div class="spinner"></div>
    <div style="font-size:13px;color:var(--text2)">প্রশ্ন লোড হচ্ছে...</div>
  </div>
</div>

<!-- ══ NAV GRID ══ -->
<div class="nav-grid-wrap" id="navGridWrap" style="display:none">
  <div class="nav-grid" id="navGrid"></div>
</div>

<!-- ══ BOTTOM BAR ══ -->
<div class="exam-bottom" id="examBottom" style="display:none">
  <button class="btn-nav" id="btnPrev" onclick="goPrev()" disabled>←</button>
  <button class="btn-skip" onclick="skipQuestion()">বাদ দাও</button>
  <button class="btn-nav" id="btnNext" onclick="goNext()">পরে →</button>
  <button class="btn-submit" onclick="openSubmitModal()">জমা দাও ✔</button>
</div>

<!-- ══ CONFIRM SUBMIT MODAL ══ -->
<div class="modal-overlay" id="submitModal">
  <div class="modal">
    <div class="modal-title">পরীক্ষা জমা দেবে?</div>
    <div class="modal-text">জমা দেওয়ার পর আর পরিবর্তন করা যাবে না।</div>
    <div class="modal-stats" id="modalStats"></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-full" onclick="closeSubmitModal()">না, ফিরে যাই</button>
      <button class="btn btn-primary btn-full" onclick="submitExam()">হ্যাঁ, জমা দাও</button>
    </div>
  </div>
</div>

<!-- ══ TOAST ══ -->
<div class="toast" id="toast" style="bottom:130px"></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script>
// ── URL Params ──
const params       = new URLSearchParams(location.search);
const PDF_ID       = params.get('pdf_id')       || '';
const PDF_NAME     = params.get('pdf_name')      || '';
const PAGES_STR    = params.get('pages')         || '';
const CHAPTER_ID   = params.get('chapter_id')   || '';
const CHAPTER_NAME = params.get('chapter_name') || '';
const SUBJECT_NAME = params.get('subject_name') || '';
const SUBJECT_ICON = params.get('icon')         || '';

// ── Exam State ──
let questions    = [];
let currentIdx   = 0;
let answers      = {};      // { qIdx: optionIndex }
let skipped      = new Set();
let timerSecs    = 30 * 60;
let timerInterval = null;
let examStartTime = null;

// ── Bengali option labels ──
const BN_LABELS = ['ক', 'খ', 'গ', 'ঘ'];

// ── Toast ──
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ── Timer ──
function startTimer() {
  examStartTime = Date.now();
  timerInterval = setInterval(() => {
    timerSecs--;
    updateTimerDisplay();
    if (timerSecs <= 0) {
      clearInterval(timerInterval);
      showToast('⏰ সময় শেষ! স্বয়ংক্রিয়ভাবে জমা হচ্ছে...');
      setTimeout(submitExam, 1500);
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m   = Math.floor(timerSecs / 60);
  const s   = timerSecs % 60;
  const txt = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const el  = document.getElementById('timerDisplay');
  el.textContent = txt;
  el.className   = timerSecs <= 60 ? 'timer-display danger'
                 : timerSecs <= 300 ? 'timer-display warning'
                 : 'timer-display';
}

// ── Score calculation ──
function calcScores() {
  let correct = 0, wrong = 0;
  questions.forEach((q, i) => {
    if (answers[i] === undefined) return;
    if (answers[i] === q.correct_index) correct++;
    else wrong++;
  });
  const skip  = questions.length - correct - wrong;
  const marks = correct * 1 - wrong * 0.25;
  return { correct, wrong, skip, marks: Math.max(0, marks) };
}

function updateScoreDisplay() {
  const { correct, wrong, skip, marks } = calcScores();
  document.getElementById('scoreCorrect').textContent = correct;
  document.getElementById('scoreWrong').textContent   = wrong;
  document.getElementById('scoreSkip').textContent    = skip;
  document.getElementById('scoreMarks').textContent   = marks.toFixed(2);

  const answered = Object.keys(answers).length;
  document.getElementById('progressFill').style.width =
    `${Math.round((answered / questions.length) * 100)}%`;
}

// ── Render question ──
function renderQuestion(idx) {
  currentIdx = idx;
  const q    = questions[idx];
  if (!q) return;

  const opts = q.options || [];
  const sel  = answers[idx];

  document.getElementById('questionArea').innerHTML = `
    <div class="q-header">
      <div class="q-num">${idx + 1}</div>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
          <span class="q-type-badge">${q.type === 'hard' ? '🔥 কঠিন' : q.type === 'true_false' ? '✅ সত্য/মিথ্যা' : '📝 MCQ'}</span>
          <span style="font-size:10px;color:var(--text3)">পৃষ্ঠা ${q.page || '—'}</span>
        </div>
        <div class="q-text">${escHtml(q.question)}</div>
      </div>
    </div>
    <div class="options-list">
      ${opts.map((opt, oi) => `
        <button
          class="option-btn${sel === oi ? ' selected' : ''}"
          onclick="selectOption(${idx}, ${oi})"
          ${sel !== undefined && sel !== oi ? '' : ''}
        >
          <div class="option-label">${BN_LABELS[oi] || (oi + 1)}</div>
          <div class="option-text">${escHtml(opt)}</div>
        </button>`).join('')}
    </div>`;

  updateNavDots();
  updateBottomNav();
}

// ── Select option ──
function selectOption(qIdx, optIdx) {
  answers[qIdx] = optIdx;
  skipped.delete(qIdx);

  // Re-render options to show selection
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    btn.classList.toggle('selected', i === optIdx);
    btn.querySelector('.option-label').style.background = i === optIdx ? 'var(--primary)' : '';
    btn.querySelector('.option-label').style.color      = i === optIdx ? '#fff' : '';
    btn.querySelector('.option-label').style.borderColor = i === optIdx ? 'var(--primary)' : '';
  });

  updateNavDots();
  updateScoreDisplay();
}

// ── Skip question ──
function skipQuestion() {
  skipped.add(currentIdx);
  delete answers[currentIdx];
  updateNavDots();
  updateScoreDisplay();
  if (currentIdx < questions.length - 1) goNext();
  else showToast('এটাই শেষ প্রশ্ন। জমা দাও বা আগের প্রশ্নে যাও।');
}

// ── Nav grid ──
function buildNavGrid() {
  document.getElementById('navGrid').innerHTML = questions.map((_, i) => `
    <button
      class="nav-dot${i === currentIdx ? ' current' : ''}${answers[i] !== undefined ? ' answered' : ''}"
      id="navDot_${i}"
      onclick="goToQuestion(${i})"
    >${i + 1}</button>`).join('');
}

function updateNavDots() {
  questions.forEach((_, i) => {
    const dot = document.getElementById(`navDot_${i}`);
    if (!dot) return;
    dot.className = 'nav-dot' +
      (i === currentIdx       ? ' current'  : '') +
      (answers[i] !== undefined ? ' answered' : '');
  });
}

function updateBottomNav() {
  document.getElementById('btnPrev').disabled = currentIdx <= 0;
  document.getElementById('btnNext').disabled = currentIdx >= questions.length - 1;
  document.getElementById('btnNext').textContent =
    currentIdx >= questions.length - 1 ? '✔ শেষ' : 'পরে →';
}

function goNext()        { if (currentIdx < questions.length - 1) goToQuestion(currentIdx + 1); else openSubmitModal(); }
function goPrev()        { if (currentIdx > 0) goToQuestion(currentIdx - 1); }
function goToQuestion(i) { renderQuestion(i); }

// ── Submit modal ──
function openSubmitModal() {
  const { correct, wrong, skip, marks } = calcScores();
  document.getElementById('modalStats').innerHTML = `
    <div class="modal-stat"><div class="modal-stat-val score-correct">${correct}</div><div class="modal-stat-lbl">সঠিক</div></div>
    <div class="modal-stat"><div class="modal-stat-val score-wrong">${wrong}</div><div class="modal-stat-lbl">ভুল</div></div>
    <div class="modal-stat"><div class="modal-stat-val score-skip">${skip}</div><div class="modal-stat-lbl">বাদ</div></div>
    <div class="modal-stat"><div class="modal-stat-val score-marks">${marks.toFixed(2)}</div><div class="modal-stat-lbl">নম্বর</div></div>`;
  document.getElementById('submitModal').classList.add('open');
}
function closeSubmitModal() {
  document.getElementById('submitModal').classList.remove('open');
}

// ── Submit ──
async function submitExam() {
  clearInterval(timerInterval);
  closeSubmitModal();

  const { correct, wrong, skip, marks } = calcScores();
  const timeTaken = Math.round((Date.now() - examStartTime) / 1000);

  // Save result to Worker (best-effort — don't block navigation)
  if (Auth.isLoggedIn()) {
    Auth.api('/api/exam/submit', {
      method: 'POST',
      body: JSON.stringify({
        pdf_id:      PDF_ID,
        pdf_name:    PDF_NAME,
        pages:       PAGES_STR,
        chapter_id:  CHAPTER_ID,
        subject_name: SUBJECT_NAME,
        answers,
        correct, wrong, skip,
        marks:       parseFloat(marks.toFixed(2)),
        total:       questions.length,
        time_taken:  timeTaken,
        questions:   questions.map((q, i) => ({
          id:            q.id,
          question:      q.question,
          options:       q.options,
          correct_index: q.correct_index,
          user_answer:   answers[i] ?? null,
        })),
      }),
    }).catch(() => {});
  }

  // Navigate to result page
  const q = new URLSearchParams({
    pdf_id:       PDF_ID,
    pdf_name:     PDF_NAME,
    pages:        PAGES_STR,
    chapter_id:   CHAPTER_ID,
    chapter_name: CHAPTER_NAME,
    subject_name: SUBJECT_NAME,
    icon:         SUBJECT_ICON,
    correct:      correct,
    wrong:        wrong,
    skip:         skip,
    marks:        marks.toFixed(2),
    total:        questions.length,
    time_taken:   timeTaken,
    result_data:  encodeURIComponent(JSON.stringify(
      questions.map((q, i) => ({
        id:            q.id,
        question:      q.question,
        options:       q.options,
        correct_index: q.correct_index,
        user_answer:   answers[i] ?? null,
        page:          q.page,
        explanation:   q.explanation || '',
      }))
    )),
  });
  window.location.href = `result.html?${q}`;
}

// ── Load questions ──
async function loadQuestions() {
  const pages   = PAGES_STR ? PAGES_STR.split(',').filter(Boolean) : [];
  const qParams = new URLSearchParams();
  if (PDF_ID)    qParams.set('pdf_id', PDF_ID);
  if (PAGES_STR) qParams.set('pages',  PAGES_STR);

  const headers = Auth.isLoggedIn() ? Auth.headers() : {};
  let res;
  try {
    res = await fetch(`${CONFIG.workerUrl}/api/exam/questions?${qParams}`, { headers });
  } catch {
    showExamError('নেটওয়ার্ক সমস্যা — ইন্টারনেট চেক করুন');
    return;
  }

  if (!res.ok) { showExamError(`সার্ভার সমস্যা (${res.status})`); return; }

  let data;
  try { data = await res.json(); } catch { showExamError('ডেটা পড়তে সমস্যা'); return; }

  questions = data.questions || [];
  if (!questions.length) {
    showExamError('এই page-গুলোতে কোনো MCQ প্রশ্ন নেই। Admin থেকে প্রশ্ন যোগ করুন।');
    return;
  }

  // Shuffle questions
  questions = questions.sort(() => Math.random() - 0.5);

  // Set timer: 2 min per question, max 45 min
  timerSecs = Math.min(questions.length * 120, 45 * 60);

  // Title
  const pageList = pages.length ? `পৃষ্ঠা: ${pages.join(', ')}` : '';
  document.getElementById('examTitleMain').textContent = PDF_NAME || 'MCQ Exam';
  document.getElementById('examTitleSub').textContent  = pageList;

  // Show UI
  document.getElementById('loadingState').remove();
  document.getElementById('navGridWrap').style.display = 'block';
  document.getElementById('examBottom').style.display  = 'flex';

  buildNavGrid();
  renderQuestion(0);
  updateScoreDisplay();
  startTimer();
}

function showExamError(msg) {
  document.getElementById('loadingState').remove();
  document.getElementById('questionArea').innerHTML = `
    <div style="text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:12px">😔</div>
      <div style="font-size:15px;font-weight:700;color:var(--text2);margin-bottom:8px">প্রশ্ন লোড হয়নি</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:20px;line-height:1.6">${escHtml(msg)}</div>
      <button class="btn btn-outline" onclick="history.back()">← ফিরে যাও</button>
    </div>`;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  if (!questions.length) return;
  const map = { '1': 0, '2': 1, '3': 2, '4': 3, 'ArrowRight': 'next', 'ArrowLeft': 'prev' };
  const act = map[e.key];
  if (act === 'next') { e.preventDefault(); goNext(); }
  else if (act === 'prev') { e.preventDefault(); goPrev(); }
  else if (typeof act === 'number') { e.preventDefault(); selectOption(currentIdx, act); }
});

// ── Boot ──
document.addEventListener('DOMContentLoaded', () => {
  Theme.init();
  loadQuestions();
});
</script>
</body>
</html>
