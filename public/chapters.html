<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অধ্যায় — AtlasPro</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ── Page Header Bar ── */
.page-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 14px 0;
}
.back-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text);
  flex-shrink: 0;
}
.back-btn:hover { background: var(--card-hover); border-color: var(--primary); }
.page-title-block { flex: 1; min-width: 0; }
.page-subject-name {
  font-size: 18px;
  font-weight: 900;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.page-subject-meta {
  font-size: 11px;
  color: var(--text3);
  margin-top: 2px;
}

/* ── Search Bar ── */
.search-wrap {
  padding: 14px 14px 0;
  position: relative;
}
.search-input {
  width: 100%;
  height: 44px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 0 14px 0 42px;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--primary); }
.search-input::placeholder { color: var(--text3); }
.search-icon {
  position: absolute;
  left: 27px; top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  pointer-events: none;
  margin-top: 7px;
}

/* ── Chapter List ── */
.chapter-list {
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ── Chapter Card ── */
.chapter-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  color: inherit;
  animation: fadeUp 0.3s ease both;
}
.chapter-card:hover {
  border-color: var(--primary);
  background: var(--card-hover);
  transform: translateX(4px);
  box-shadow: -3px 0 0 var(--primary), var(--shadow);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.chapter-num {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--primary-light);
  border: 1.5px solid rgba(108,99,255,0.35);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900;
  color: var(--primary);
  flex-shrink: 0;
}
.chapter-body { flex: 1; min-width: 0; }
.chapter-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  margin-bottom: 4px;
}
.chapter-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
}
.badge-pdf {
  background: rgba(108,99,255,0.12);
  color: var(--accent);
  border: 1px solid rgba(108,99,255,0.2);
}
.badge-lock {
  background: rgba(245,158,11,0.1);
  color: var(--amber);
  border: 1px solid rgba(245,158,11,0.2);
}
.badge-new {
  background: rgba(16,185,129,0.12);
  color: var(--green);
  border: 1px solid rgba(16,185,129,0.2);
}
.chapter-arrow {
  font-size: 18px;
  color: var(--text3);
  flex-shrink: 0;
  transition: color 0.2s, transform 0.2s;
}
.chapter-card:hover .chapter-arrow {
  color: var(--primary);
  transform: translateX(3px);
}

/* ── Skeleton Loading ── */
.skeleton-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.skel {
  background: linear-gradient(90deg, var(--border) 25%, var(--card-hover) 50%, var(--border) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease infinite;
  border-radius: 6px;
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skel-circle { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
.skel-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.skel-line-lg { height: 14px; width: 70%; }
.skel-line-sm { height: 10px; width: 40%; }
.skel-arrow { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }

/* ── Error State ── */
.error-state {
  text-align: center;
  padding: 40px 20px;
}
.error-icon { font-size: 48px; margin-bottom: 12px; }
.error-title { font-size: 15px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
.error-text { font-size: 12px; color: var(--text3); margin-bottom: 20px; line-height: 1.6; }

/* ── Count Bar ── */
.count-bar {
  padding: 8px 14px 0;
  font-size: 11px;
  color: var(--text3);
  font-weight: 600;
}
.count-bar span { color: var(--primary); }

/* ── No Results ── */
.no-results {
  text-align: center;
  padding: 40px 20px;
  color: var(--text3);
}
.no-results-icon { font-size: 40px; margin-bottom: 10px; }
.no-results-text { font-size: 13px; }
</style>
</head>

      <span>🚪</span> Logout
    </div>
  </nav>
</div>

<!-- ══ MAIN ══ -->
<main style="padding-bottom:16px">

  <!-- Page Header -->
  <div class="page-bar">
    <button class="back-btn" onclick="goBack()" aria-label="পেছনে যাও">
      ←
    </button>
    <div class="page-title-block">
      <div class="page-subject-name" id="subjectTitle">অধ্যায়</div>
      <div class="page-subject-meta" id="subjectMeta">লোড হচ্ছে...</div>
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input
      type="search"
      class="search-input"
      id="searchInput"
      placeholder="অধ্যায় খুঁজুন..."
      oninput="filterChapters()"
      autocomplete="off"
    >
  </div>

  <!-- Count Bar -->
  <div class="count-bar" id="countBar" style="display:none">
    মোট <span id="countNum">0</span>টি অধ্যায়
  </div>

  <!-- Chapter Area -->
  <div id="chapterArea">

  </div>

</main>

<!-- ══ TOAST ══ -->
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script>
// ── URL Params ──
const params = new URLSearchParams(location.search);
const SUBJECT_ID   = params.get('subject_id') || '';
const SUBJECT_NAME = params.get('name') || 'অধ্যায়';
const SUBJECT_ICON = params.get('icon') || '📚';

// ── State ──
let allChapters = [];
let isLoading   = true;
let hasError    = false;

// ── Sidebar ──
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// ── Toast ──
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ── Back Navigation ──
function goBack() {
  if (document.referrer && document.referrer.includes(location.hostname)) {
    history.back();
  } else {
    window.location.href = 'index.html';
  }
}

// ── Init Header ──
function initHeader() {
  const name      = Auth.getUserName();
  const isAdmin   = Auth.isAdmin();
  const isPremium = localStorage.getItem('is_premium') === 'true';
  const initial   = name ? name[0].toUpperCase() : 'A';

  document.getElementById('avatarBtn').textContent    = initial;
  document.getElementById('sidebarAvatar').textContent = initial;
  document.getElementById('sidebarName').textContent   = name || 'Guest';

  if (isPremium) {
    const badge = document.getElementById('sidebarBadge');
    badge.className   = 'sidebar-badge badge-premium';
    badge.textContent = '⭐ Premium';
  }
  if (isAdmin) {
    document.getElementById('adminLink').style.display = 'flex';
  }

  document.getElementById('subjectTitle').textContent =
    `${SUBJECT_ICON} ${SUBJECT_NAME}`;
}

// ── Skeleton Loading ──
function showSkeleton() {
  const area = document.getElementById('chapterArea');
  const skels = Array.from({ length: 6 }, () => `
    <div class="skeleton-card">
      <div class="skel skel-circle"></div>
      <div class="skel-lines">
        <div class="skel skel-line-lg"></div>
        <div class="skel skel-line-sm"></div>
      </div>
      <div class="skel skel-arrow"></div>
    </div>`).join('');
  area.innerHTML = `<div class="chapter-list">${skels}</div>`;
}

// ── Render Chapters ──
function renderChapters(chapters) {
  const area = document.getElementById('chapterArea');

  if (!chapters.length) {
    area.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📂</div>
        <div class="empty-title">কোনো অধ্যায় নেই</div>
        <div class="empty-text">এই বিষয়ে এখনো কোনো অধ্যায় যোগ করা হয়নি</div>
      </div>`;
    document.getElementById('countBar').style.display = 'none';
    return;
  }

  document.getElementById('countBar').style.display = 'block';
  document.getElementById('countNum').textContent = chapters.length;

  area.innerHTML = `<div class="chapter-list">${chapters.map((ch, i) => buildCard(ch, i)).join('')}</div>`;
}

function buildCard(ch, idx) {
  const pdfCount  = ch.pdf_count ?? ch.pdfCount ?? 0;
  const isLocked  = ch.is_premium && !Auth.isPremium();
  const isNew     = ch.is_new || false;
  const delay     = Math.min(idx * 40, 400);

  const pdfBadge  = pdfCount > 0
    ? `<span class="badge badge-pdf">📄 ${pdfCount}টি PDF</span>`
    : '';
  const lockBadge = isLocked
    ? `<span class="badge badge-lock">🔒 Premium</span>`
    : '';
  const newBadge  = isNew
    ? `<span class="badge badge-new">✨ নতুন</span>`
    : '';

  const href = isLocked
    ? `javascript:showToast('⭐ এই অধ্যায়টি Premium-only')`
    : `pdfs.html?chapter_id=${ch.id}&name=${encodeURIComponent(ch.name)}&subject_name=${encodeURIComponent(SUBJECT_NAME)}&icon=${encodeURIComponent(SUBJECT_ICON)}`;

  return `
    <a class="chapter-card" href="${href}" style="animation-delay:${delay}ms">
      <div class="chapter-num">${idx + 1}</div>
      <div class="chapter-body">
        <div class="chapter-name">${escHtml(ch.name)}</div>
        <div class="chapter-badges">
          ${pdfBadge}${lockBadge}${newBadge}
        </div>
      </div>
      <div class="chapter-arrow">›</div>
    </a>`;
}

// ── Search / Filter ──
function filterChapters() {
  const q        = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = q
    ? allChapters.filter(ch => ch.name.toLowerCase().includes(q))
    : allChapters;

  const area = document.getElementById('chapterArea');

  if (!filtered.length) {
    area.innerHTML = `
      <div class="no-results">
        <div class="no-results-icon">🔍</div>
        <div class="no-results-text">"${escHtml(q)}" এর জন্য কোনো অধ্যায় পাওয়া যায়নি</div>
      </div>`;
    document.getElementById('countBar').style.display = 'none';
    return;
  }

  document.getElementById('countBar').style.display = 'block';
  document.getElementById('countNum').textContent = filtered.length;
  area.innerHTML = `<div class="chapter-list">${filtered.map((ch, i) => buildCard(ch, i)).join('')}</div>`;
}

// ── Load Chapters ──
async function loadChapters(retry = false) {
  if (!SUBJECT_ID) {
    renderError('subject_id নেই — সঠিক URL দিয়ে আসুন');
    return;
  }

  if (!retry) showSkeleton();

  const url = `${CONFIG.workerUrl}/api/chapters?subject_id=${SUBJECT_ID}`;
  const headers = Auth.isLoggedIn() ? Auth.headers() : {};

  let res;
  try {
    res = await fetch(url, { headers });
  } catch {
    renderError('নেটওয়ার্ক সমস্যা — ইন্টারনেট চেক করুন');
    return;
  }

  if (!res.ok) {
    renderError(`সার্ভার সমস্যা (${res.status}) — একটু পরে আবার চেষ্টা করুন`);
    return;
  }

  let data;
  try { data = await res.json(); }
  catch { renderError('ডেটা পড়তে সমস্যা হয়েছে'); return; }

  allChapters = data.chapters || data.data || [];

  document.getElementById('subjectMeta').textContent =
    `${allChapters.length}টি অধ্যায়`;

  renderChapters(allChapters);
}

// ── Error State ──
function renderError(msg) {
  document.getElementById('subjectMeta').textContent = 'লোড ব্যর্থ';
  document.getElementById('countBar').style.display = 'none';
  document.getElementById('chapterArea').innerHTML = `
    <div class="error-state">
      <div class="error-icon">⚠️</div>
      <div class="error-title">লোড করা যায়নি</div>
      <div class="error-text">${escHtml(msg)}</div>
      <button class="btn btn-outline" onclick="loadChapters(true)">↻ আবার চেষ্টা করুন</button>
    </div>`;
}

// ── Helpers ──
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Extend Auth for premium check ──
Auth.isPremium = () => localStorage.getItem('is_premium') === 'true';

// ── Boot ──
document.addEventListener('DOMContentLoaded', () => {
  initHeader();
  loadChapters();
});
</script>
