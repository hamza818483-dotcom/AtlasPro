<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas AI — AtlasPro</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ── Chat Layout ── */
.chat-page {
  display: flex;
  flex-direction: column;
  height: calc(100vh - var(--header-h));
  overflow: hidden;
}

/* ── AI Header ── */
.ai-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 10px;
  z-index: 100;
  background: linear-gradient(135deg, rgba(26,26,46,0.97), rgba(18,18,31,0.97));
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(16px);
}
.ai-header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, #818CF8, #C4B5FD, #F472B6, #818CF8);
  background-size: 300% 100%;
  animation: gradShift 3s linear infinite;
}
[data-theme="light"] .ai-header {
  background: linear-gradient(135deg, rgba(240,242,255,0.97), rgba(232,234,255,0.97));
}
.ai-header-back {
  width: 38px; height: 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  font-size: 18px;
  color: var(--text);
  transition: all 0.2s;
  flex-shrink: 0;
}
.ai-header-back:hover { background: var(--card-hover); border-color: var(--primary); }
.ai-header-info {
  flex: 1;
  min-width: 0;
}
.ai-header-title {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(135deg, #818CF8, #C4B5FD, #F472B6, #818CF8);
  background-size: 300% 300%;
  animation: gradShift 3s linear infinite;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.ai-header-status {
  font-size: 10px;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 4px;
}
.ai-header-status::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  display: inline-block;
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.ai-header-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ── Chat Messages Area ── */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}

/* ── Welcome Screen ── */
.chat-welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  text-align: center;
  padding: 20px;
  gap: 16px;
}
.welcome-icon {
  font-size: 64px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.welcome-title {
  font-size: 22px;
  font-weight: 900;
  background: linear-gradient(135deg, #818CF8, #C4B5FD, #F472B6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.welcome-sub {
  font-size: 13px;
  color: var(--text2);
  max-width: 300px;
  line-height: 1.6;
}
.welcome-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 360px;
}
.welcome-chip {
  font-size: 11px;
  padding: 8px 14px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.2s;
}
.welcome-chip:hover {
  border-color: var(--primary);
  color: var(--text);
  background: var(--primary-light);
}

/* ── Message Bubbles ── */
.msg-row {
  display: flex;
  gap: 8px;
  max-width: 88%;
  animation: msgIn 0.3s ease-out;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-row.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.msg-row.ai {
  align-self: flex-start;
}
.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 2px;
}
.msg-row.ai .msg-avatar {
  background: linear-gradient(135deg, #818CF8, #C4B5FD);
  color: white;
  font-weight: 700;
}
.msg-row.user .msg-avatar {
  background: var(--primary-light);
  border: 1.5px solid var(--primary);
  color: var(--primary);
  font-weight: 700;
}
.msg-bubble {
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 13px;
  line-height: 1.7;
  word-break: break-word;
  position: relative;
}
.msg-row.user .msg-bubble {
  background: linear-gradient(135deg, #6C63FF, #818CF8);
  color: white;
  border-bottom-right-radius: 4px;
}
.msg-row.ai .msg-bubble {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-bottom-left-radius: 4px;
}
.msg-time {
  font-size: 9px;
  color: var(--text3);
  margin-top: 4px;
  text-align: right;
}
.msg-row.ai .msg-time { text-align: left; }

/* ── AI Bubble Formatted Content ── */
.msg-bubble strong, .msg-bubble b {
  color: var(--accent);
  font-weight: 700;
}
.msg-row.user .msg-bubble strong,
.msg-row.user .msg-bubble b {
  color: #fff;
}
.msg-bubble code {
  background: rgba(0,0,0,0.25);
  padding: 1px 6px;
  border-radius: 4px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
}
.msg-bubble pre {
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin: 8px 0;
  overflow-x: auto;
  font-family: 'Courier New', monospace;
  font-size: 11.5px;
  line-height: 1.5;
}
.msg-bubble pre code {
  background: none;
  padding: 0;
}
[data-theme="light"] .msg-bubble pre {
  background: rgba(0,0,0,0.06);
}
[data-theme="light"] .msg-bubble code {
  background: rgba(0,0,0,0.08);
}

/* ── Typing Indicator ── */
.typing-row {
  display: flex;
  gap: 8px;
  align-self: flex-start;
  max-width: 88%;
  animation: msgIn 0.3s ease-out;
}
.typing-bubble {
  padding: 12px 18px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.typing-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text3);
  animation: typingBounce 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* ── Input Area ── */
.chat-input-area {
  padding: 10px 12px 14px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.chat-input-wrap {
  flex: 1;
  display: flex;
  align-items: flex-end;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 22px;
  padding: 4px 6px 4px 16px;
  transition: border-color 0.2s;
}
.chat-input-wrap:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
}
.chat-input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 13.5px;
  padding: 8px 0;
  outline: none;
  resize: none;
  max-height: 100px;
  line-height: 1.4;
  font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
}
.chat-input::placeholder { color: var(--text3); }
.send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6C63FF, #818CF8);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  transition: all 0.2s;
  border: none;
  cursor: pointer;
}
.send-btn:hover { transform: scale(1.05); box-shadow: var(--shadow-glow); }
.send-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* ── Clear Chat Button ── */
.clear-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  font-size: 15px;
  color: var(--text2);
  transition: all 0.2s;
}
.clear-btn:hover {
  background: rgba(239,68,68,0.15);
  border-color: var(--red);
  color: var(--red);
}

/* ── Error Toast ── */
.chat-toast {
  position: fixed;
  bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--red);
  color: white;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: 500;
  white-space: nowrap;
}
.chat-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Responsive ── */
@media (min-width: 600px) {
  .chat-messages { padding: 20px 40px 10px; }
  .chat-input-area { padding: 12px 40px 16px; }
  .msg-row { max-width: 70%; }
  .typing-row { max-width: 70%; }
}
@media (min-width: 900px) {
  .chat-messages { padding: 24px 15% 10px; }
  .chat-input-area { padding: 14px 15% 18px; }
  .msg-row { max-width: 60%; }
  .typing-row { max-width: 60%; }
}

/* ── Safe area for mobile ── */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  .chat-input-area {
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
  }
}

/* Override body padding for chat page */
body {
  padding-bottom: 0;
}
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header class="ai-header">
  <button class="ai-header-back" onclick="window.location.href='index.html'" title="ফিরে যান">←</button>
  <div class="ai-header-info">
    <div class="ai-header-title">🤖 Atlas AI</div>
    <div class="ai-header-status">অনলাইন — সর্বদা সাহায্যে প্রস্তুত</div>
  </div>
  <div class="ai-header-actions">
    <button class="icon-btn" id="themeToggle" onclick="Theme.toggle()" title="Theme">☀️</button>
    <button class="clear-btn" onclick="clearChat()" title="চ্যাট মুছুন">🗑️</button>
  </div>
</header>

<!-- ══ CHAT PAGE ══ -->
<div class="chat-page">

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages">
    <!-- Welcome Screen -->
    <div class="chat-welcome" id="welcomeScreen">
      <div class="welcome-icon">🤖</div>
      <div class="welcome-title">Atlas AI-তে স্বাগতম</div>
      <div class="welcome-sub">
        আমি Atlas AI, তোমার পড়াশোনার সহকারী। যেকোনো বিষয়ে প্রশ্ন করো, আমি সাহায্য করতে প্রস্তুত!
      </div>
      <div class="welcome-chips">
        <button class="welcome-chip" onclick="sendChip(this)">📘 পদার্থবিজ্ঞান বুঝিয়ে বলো</button>
        <button class="welcome-chip" onclick="sendChip(this)">🧮 গণিতে সাহায্য চাই</button>
        <button class="welcome-chip" onclick="sendChip(this)">🧪 রসায়নের সূত্র শেখাও</button>
        <button class="welcome-chip" onclick="sendChip(this)">📝 পরীক্ষার টিপস দাও</button>
        <button class="welcome-chip" onclick="sendChip(this)">🇬🇧 ইংরেজি গ্রামার শেখাও</button>
        <button class="welcome-chip" onclick="sendChip(this)">💡 পড়ার রুটিন বানাও</button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <div class="chat-input-wrap">
      <textarea class="chat-input" id="chatInput" rows="1"
        placeholder="তোমার প্রশ্ন লেখো..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="পাঠাও">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<!-- Toast -->
<div class="chat-toast" id="chatToast"></div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>

<script>
/* ══════════════════════════════════════════
   Atlas AI — Chat Logic
   ══════════════════════════════════════════ */

const STORAGE_KEY = 'atlas_ai_chat_history';
let chatHistory = [];
let isSending = false;

// ── DOM refs ──
const chatMessages = document.getElementById('chatMessages');
const chatInput    = document.getElementById('chatInput');
const sendBtn      = document.getElementById('sendBtn');
const welcomeScreen = document.getElementById('welcomeScreen');

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  if (!Auth.isLoggedIn()) {
    window.location.href = 'auth.html';
    return;
  }
  loadHistory();
  chatInput.focus();
});

// ── Load history from sessionStorage ──
function loadHistory() {
  try {
    const saved = sessionStorage.getItem(STORAGE_KEY);
    if (saved) {
      chatHistory = JSON.parse(saved);
      if (chatHistory.length > 0) {
        welcomeScreen.style.display = 'none';
        chatHistory.forEach(msg => renderMessage(msg.role, msg.content, msg.time, false));
        scrollToBottom();
      }
    }
  } catch(e) {
    chatHistory = [];
  }
}

// ── Save history ──
function saveHistory() {
  try {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
  } catch(e) { /* quota exceeded — ignore */ }
}

// ── Send chip suggestion ──
function sendChip(el) {
  const text = el.textContent.replace(/^[^\s]+\s/, '').trim();
  chatInput.value = text;
  sendMessage();
}

// ── Handle Enter key ──
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── Auto-resize textarea ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ── Get time string ──
function getTimeStr() {
  return new Date().toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
}

// ── Send message ──
async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || isSending) return;

  isSending = true;
  sendBtn.disabled = true;

  // Hide welcome
  if (welcomeScreen) welcomeScreen.style.display = 'none';

  // Add user message
  const userTime = getTimeStr();
  chatHistory.push({ role: 'user', content: text, time: userTime });
  renderMessage('user', text, userTime);
  saveHistory();

  // Clear input
  chatInput.value = '';
  chatInput.style.height = 'auto';
  scrollToBottom();

  // Show typing
  showTyping();

  try {
    const res = await fetch(CONFIG.workerUrl + '/api/ai/chat', {
      method: 'POST',
      headers: Auth.headers(),
      body: JSON.stringify({ message: text }),
    });

    hideTyping();

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error || 'সার্ভার থেকে ত্রুটি হয়েছে');
    }

    const data = await res.json();
    const reply = data.reply || 'কোনো উত্তর পাওয়া যায়নি।';
    const aiTime = getTimeStr();

    chatHistory.push({ role: 'ai', content: reply, time: aiTime });
    renderMessage('ai', reply, aiTime);
    saveHistory();

  } catch(err) {
    hideTyping();
    showToast(err.message || 'কিছু সমস্যা হয়েছে, আবার চেষ্টা করো');
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    chatInput.focus();
    scrollToBottom();
  }
}

// ── Render a message bubble ──
function renderMessage(role, content, time, animate = true) {
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  if (!animate) row.style.animation = 'none';

  const userName = Auth.getUserName() || 'আমি';
  const avatarLetter = role === 'user' ? userName.charAt(0).toUpperCase() : 'AI';

  const formattedContent = role === 'ai' ? formatMarkdown(content) : escapeHtml(content);

  row.innerHTML = `
    <div class="msg-avatar">${role === 'ai' ? '🤖' : avatarLetter}</div>
    <div>
      <div class="msg-bubble">${formattedContent}</div>
      <div class="msg-time">${time || ''}</div>
    </div>
  `;

  chatMessages.appendChild(row);
}

// ── Typing indicator ──
function showTyping() {
  const existing = document.getElementById('typingIndicator');
  if (existing) return;

  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typingIndicator';
  row.innerHTML = `
    <div class="msg-avatar" style="background:linear-gradient(135deg,#818CF8,#C4B5FD);color:white;font-size:12px;font-weight:700;">🤖</div>
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  `;
  chatMessages.appendChild(row);
  scrollToBottom();
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

// ── Scroll to bottom ──
function scrollToBottom() {
  requestAnimationFrame(() => {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });
}

// ── Clear chat ──
function clearChat() {
  if (chatHistory.length === 0) return;
  if (!confirm('সব চ্যাট মুছে ফেলতে চান?')) return;

  chatHistory = [];
  sessionStorage.removeItem(STORAGE_KEY);

  // Remove all messages and typing indicators
  chatMessages.innerHTML = '';

  // Re-add welcome screen
  const welcome = document.createElement('div');
  welcome.className = 'chat-welcome';
  welcome.id = 'welcomeScreen';
  welcome.innerHTML = `
    <div class="welcome-icon">🤖</div>
    <div class="welcome-title">Atlas AI-তে স্বাগতম</div>
    <div class="welcome-sub">
      আমি Atlas AI, তোমার পড়াশোনার সহকারী। যেকোনো বিষয়ে প্রশ্ন করো, আমি সাহায্য করতে প্রস্তুত!
    </div>
    <div class="welcome-chips">
      <button class="welcome-chip" onclick="sendChip(this)">📘 পদার্থবিজ্ঞান বুঝিয়ে বলো</button>
      <button class="welcome-chip" onclick="sendChip(this)">🧮 গণিতে সাহায্য চাই</button>
      <button class="welcome-chip" onclick="sendChip(this)">🧪 রসায়নের সূত্র শেখাও</button>
      <button class="welcome-chip" onclick="sendChip(this)">📝 পরীক্ষার টিপস দাও</button>
      <button class="welcome-chip" onclick="sendChip(this)">🇬🇧 ইংরেজি গ্রামার শেখাও</button>
      <button class="welcome-chip" onclick="sendChip(this)">💡 পড়ার রুটিন বানাও</button>
    </div>
  `;
  chatMessages.appendChild(welcome);
}

// ── Format markdown-like content ──
function formatMarkdown(text) {
  // Escape HTML first
  let html = escapeHtml(text);

  // Code blocks: ```...```
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code>${code.trim()}</code></pre>`;
  });

  // Inline code: `...`
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Bold: **...**  or __...__
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');

  // Italic: *...* or _..._
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/_(.+?)_/g, '<em>$1</em>');

  // Line breaks
  html = html.replace(/\n/g, '<br>');

  return html;
}

// ── Escape HTML ──
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ── Toast ──
function showToast(msg) {
  const toast = document.getElementById('chatToast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
