<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
body{padding-top:56px;padding-bottom:66px;}
.admin-header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 14px;z-index:100;}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--text);text-decoration:none;transition:all 0.2s;flex-shrink:0;}
.back-btn:hover{border-color:var(--primary);}
.admin-header-title{flex:1;font-size:15px;font-weight:900;}
.stats-row{display:flex;border-bottom:1px solid var(--border);}
.st-item{flex:1;padding:12px 8px;text-align:center;border-right:1px solid var(--border);}
.st-item:last-child{border-right:none;}
.st-val{font-size:20px;font-weight:900;color:var(--primary);}
.st-lbl{font-size:9px;color:var(--text3);font-weight:600;text-transform:uppercase;}
.search-wrap{padding:12px 14px 0;position:relative;}
.search-input{width:100%;height:44px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:0 14px 0 42px;font-size:14px;color:var(--text);outline:none;transition:border-color 0.2s;font-family:inherit;}
.search-input:focus{border-color:var(--primary);}
.search-input::placeholder{color:var(--text3);}
.search-icon{position:absolute;left:27px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;margin-top:6px;}
.filter-tabs{display:flex;padding:10px 14px 0;gap:6px;overflow-x:auto;scrollbar-width:none;}
.filter-tabs::-webkit-scrollbar{display:none;}
.filter-tab{padding:6px 14px;border-radius:30px;font-size:11px;font-weight:700;border:1.5px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all 0.2s;font-family:inherit;}
.filter-tab.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);}
.count-bar{padding:8px 14px 0;font-size:11px;color:var(--text3);font-weight:600;}
.count-bar span{color:var(--primary);}
.user-list{padding:10px 14px;display:flex;flex-direction:column;gap:8px;}
.user-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;animation:fadeUp 0.3s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.user-main{display:flex;align-items:center;gap:12px;padding:14px;}
.user-avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-light);border:2px solid var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--primary);flex-shrink:0;}
.user-avatar.premium-av{border-color:var(--amber);background:rgba(245,158,11,0.1);color:var(--amber);}
.user-info{flex:1;min-width:0;}
.user-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-phone{font-size:11px;color:var(--text3);margin-top:1px;}
.user-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
.ubadge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;}
.ub-free{background:rgba(99,179,237,0.12);color:#63B3ED;}
.ub-premium{background:rgba(245,158,11,0.12);color:var(--amber);}
.ub-batch{background:rgba(108,99,255,0.12);color:var(--accent);}
.user-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.action-btn{height:30px;padding:0 12px;border-radius:8px;font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all 0.2s;white-space:nowrap;}
.btn-premium-on{background:rgba(245,158,11,0.12);color:var(--amber);border:1px solid rgba(245,158,11,0.3);}
.btn-premium-on:hover{background:rgba(245,158,11,0.2);}
.btn-premium-off{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.3);}
.btn-premium-off:hover{background:rgba(16,185,129,0.2);}
.btn-delete{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.2);}
.btn-delete:hover{background:rgba(239,68,68,0.18);}
.user-details{border-top:1px solid var(--border);padding:10px 14px;background:var(--bg2);display:none;font-size:12px;color:var(--text2);line-height:1.8;}
.user-details.open{display:block;}
.user-detail-row{display:flex;gap:8px;}
.detail-lbl{color:var(--text3);min-width:90px;}
.confirm-bar{padding:10px 14px;background:rgba(239,68,68,0.08);border-top:1px solid rgba(239,68,68,0.2);display:none;align-items:center;gap:8px;}
.confirm-bar.open{display:flex;}
.confirm-text{flex:1;font-size:12px;color:var(--red);font-weight:600;}
.skel{background:linear-gradient(90deg,var(--border) 25%,var(--card-hover) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.4s ease infinite;border-radius:6px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-user{height:82px;border-radius:var(--radius);margin-bottom:8px;}
.admin-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100;}
.admin-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text3);font-size:10px;text-decoration:none;transition:color 0.2s;}
.admin-nav-item.active{color:var(--primary);}
.admin-nav-icon{font-size:20px;}
</style>
</head>
<body>
<header class="admin-header">
  <a class="back-btn" href="index.html">←</a>
  <div class="admin-header-title">👥 ব্যবহারকারী</div>
  <button class="icon-btn" id="themeToggle" onclick="Theme.toggle()">☀️</button>
</header>
<main>
  <div class="stats-row" id="userStats">
    <div class="st-item"><div class="st-val">—</div><div class="st-lbl">মোট</div></div>
    <div class="st-item"><div class="st-val">—</div><div class="st-lbl">Premium</div></div>
    <div class="st-item"><div class="st-val">—</div><div class="st-lbl">আজকের</div></div>
  </div>
  <div class="search-wrap"><span class="search-icon">🔍</span><input type="search" class="search-input" id="searchInput" placeholder="নাম বা phone দিয়ে খুঁজুন..." oninput="debounceSearch()" autocomplete="off"></div>
  <div class="filter-tabs">
    <button class="filter-tab active" onclick="setFilter('all',this)">সবাই</button>
    <button class="filter-tab" onclick="setFilter('free',this)">🆓 Free</button>
    <button class="filter-tab" onclick="setFilter('premium',this)">⭐ Premium</button>
    <button class="filter-tab" onclick="setFilter('today',this)">📅 আজকের</button>
  </div>
  <div class="count-bar" id="countBar" style="display:none">মোট <span id="countNum">0</span> জন</div>
  <div id="userArea"><div class="user-list"><div class="skel skel-user"></div><div class="skel skel-user"></div><div class="skel skel-user"></div></div></div>
</main>
<nav class="admin-nav">
  <a class="admin-nav-item" href="index.html"><span class="admin-nav-icon">📊</span>Dashboard</a>
  <a class="admin-nav-item" href="subjects.html"><span class="admin-nav-icon">📚</span>বিষয়</a>
  <a class="admin-nav-item" href="mcq.html"><span class="admin-nav-icon">❓</span>MCQ</a>
  <a class="admin-nav-item active" href="users.html"><span class="admin-nav-icon">👥</span>Users</a>
  <a class="admin-nav-item" href="announcements.html"><span class="admin-nav-icon">📢</span>ঘোষণা</a>
</nav>
<div class="toast" id="toast"></div>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script>
if(!Auth.isAdmin()) window.location.href='../index.html';
function showToast(msg,d=2500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),d);}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function maskPhone(p){if(!p||p.length<6)return p||'—';return p.slice(0,4)+'****'+p.slice(-2);}

let currentFilter='all', searchTimer=null;

function setFilter(f,el){
  currentFilter=f;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  loadUsers();
}
function debounceSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(loadUsers,350);}

async function loadUsers(){
  const q=document.getElementById('searchInput').value.trim();
  const area=document.getElementById('userArea');
  area.innerHTML='<div class="user-list"><div class="skel skel-user"></div><div class="skel skel-user"></div><div class="skel skel-user"></div></div>';
  try{
    const params=new URLSearchParams({filter:currentFilter});
    if(q) params.set('search',q);
    const res=await Auth.api('/api/admin/users?'+params);
    if(!res.ok) throw new Error(res.status);
    const data=await res.json();
    const users=data.users||[];
    document.getElementById('countBar').style.display='block';
    document.getElementById('countNum').textContent=users.length;
    if(!users.length){area.innerHTML='<div class="empty" style="padding:40px 20px"><div class="empty-icon">👥</div><div class="empty-title">কোনো user নেই</div></div>';return;}
    area.innerHTML='<div class="user-list">'+users.map((u,i)=>buildUserCard(u,i)).join('')+'</div>';
  }catch{area.innerHTML='<div class="empty" style="padding:40px 20px"><div class="empty-icon">⚠️</div><div class="empty-title">লোড হয়নি</div><button class="btn btn-outline" style="margin-top:12px" onclick="loadUsers()">↻ আবার</button></div>';}
}

function buildUserCard(u,i){
  const isPrem=u.is_premium;
  const avClass=isPrem?'user-avatar premium-av':'user-avatar';
  const initial=(u.name||'U')[0].toUpperCase();
  const premBtn=isPrem
    ?`<button class="action-btn btn-premium-on" onclick="togglePremium('${u.id}',false,this)">Premium সরাও</button>`
    :`<button class="action-btn btn-premium-off" onclick="togglePremium('${u.id}',true,this)">⭐ Premium দাও</button>`;
  return`<div class="user-card" id="uc_${u.id}" style="animation-delay:${i*40}ms">
    <div class="user-main">
      <div class="${avClass}">${initial}</div>
      <div class="user-info">
        <div class="user-name">${escHtml(u.name||'—')}</div>
        <div class="user-phone">${maskPhone(u.phone)}</div>
        <div class="user-badges">
          ${isPrem?'<span class="ubadge ub-premium">⭐ Premium</span>':'<span class="ubadge ub-free">🆓 Free</span>'}
          ${u.batch?`<span class="ubadge ub-batch">HSC ${u.batch}</span>`:''}
        </div>
      </div>
      <div class="user-actions">
        ${premBtn}
        <button class="action-btn" style="background:var(--card);border:1px solid var(--border);color:var(--text2)" onclick="toggleDetail('${u.id}')">ডিটেইলস</button>
        <button class="action-btn btn-delete" onclick="confirmDelete('${u.id}')">🗑️ মুছো</button>
      </div>
    </div>
    <div class="user-details" id="det_${u.id}">
      <div class="user-detail-row"><span class="detail-lbl">কলেজ:</span>${escHtml(u.college||'—')}</div>
      <div class="user-detail-row"><span class="detail-lbl">SSC GPA:</span>${u.ssc_gpa||'—'}</div>
      <div class="user-detail-row"><span class="detail-lbl">HSC GPA:</span>${u.hsc_gpa||'—'}</div>
      <div class="user-detail-row"><span class="detail-lbl">নিবন্ধন:</span>${u.created_at?new Date(u.created_at).toLocaleDateString('bn-BD'):'—'}</div>
      <div class="user-detail-row"><span class="detail-lbl">মোট Exam:</span>${u.total_exams||0}টি</div>
    </div>
    <div class="confirm-bar" id="conf_${u.id}">
      <span class="confirm-text">সত্যিই মুছে ফেলবে?</span>
      <button class="action-btn btn-delete" onclick="deleteUser('${u.id}')">হ্যাঁ, মুছো</button>
      <button class="action-btn" style="background:var(--card);border:1px solid var(--border);color:var(--text2)" onclick="cancelDelete('${u.id}')">না</button>
    </div>
  </div>`;
}

function toggleDetail(id){document.getElementById('det_'+id).classList.toggle('open');}
function confirmDelete(id){document.getElementById('conf_'+id).classList.add('open');}
function cancelDelete(id){document.getElementById('conf_'+id).classList.remove('open');}

async function togglePremium(id,give,btn){
  btn.disabled=true;
  try{
    const res=await Auth.api('/api/admin/users/'+id+'/premium',{method:'PUT',body:JSON.stringify({is_premium:give})});
    if(!res.ok) throw new Error();
    showToast(give?'⭐ Premium দেওয়া হয়েছে':'✅ Premium সরানো হয়েছে');
    loadUsers();
  }catch{showToast('❌ সমস্যা হয়েছে');btn.disabled=false;}
}

async function deleteUser(id){
  try{
    const res=await Auth.api('/api/admin/users/'+id,{method:'DELETE'});
    if(!res.ok) throw new Error();
    showToast('🗑️ User মুছে ফেলা হয়েছে');
    loadUsers();
  }catch{showToast('❌ মুছতে সমস্যা');}
}

async function loadStats(){
  try{
    const res=await Auth.api('/api/admin/user-stats');
    if(!res.ok) return;
    const d=await res.json();
    document.getElementById('userStats').innerHTML=`
      <div class="st-item"><div class="st-val">${d.total??'—'}</div><div class="st-lbl">মোট</div></div>
      <div class="st-item"><div class="st-val">${d.premium??'—'}</div><div class="st-lbl">Premium</div></div>
      <div class="st-item"><div class="st-val">${d.today??'—'}</div><div class="st-lbl">আজকের</div></div>`;
  }catch{}
}

document.addEventListener('DOMContentLoaded',()=>{loadStats();loadUsers();});
</script>
</body>
</html>
