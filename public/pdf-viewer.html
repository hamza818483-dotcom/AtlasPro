<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Viewer — AtlasPro</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ── Compact viewer header (override) ── */
.viewer-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: rgba(10,10,20,0.95);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  z-index: 100;
  backdrop-filter: blur(12px);
}
[data-theme="light"] .viewer-header { background: rgba(240,242,255,0.95); }
.viewer-back {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer;
  color: var(--text); flex-shrink: 0;
  transition: all 0.2s;
}
.viewer-back:hover { border-color: var(--primary); }
.viewer-title {
  flex: 1; min-width: 0;
  font-size: 13px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.viewer-page-badge {
  font-size: 11px; font-weight: 700;
  background: var(--primary-light);
  color: var(--primary);
  border: 1px solid rgba(108,99,255,0.3);
  padding: 4px 10px;
  border-radius: 20px;
  flex-shrink: 0;
}

/* ── Body override for viewer ── */
body {
  padding-top: 52px;
  padding-bottom: 0;
}

/* ── PDF Render Area ── */
.pdf-area {
  background: #1a1a1a;
  min-height: calc(100vh - 52px);
  display: flex;
  flex-direction: column;
  align-items: center;
}
[data-theme="light"] .pdf-area { background: #e0e0e0; }

/* ── PDF Page Canvas Wrapper ── */
.page-wrap {
  width: 100%;
  max-width: 720px;
  position: relative;
}
.page-wrap canvas {
  width: 100%;
  height: auto;
  display: block;
}

/* ── Page separator ── */
.page-separator {
  width: 100%;
  max-width: 720px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
}
.page-sep-line { flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
.page-sep-label {
  font-size: 10px;
  font-weight: 700;
  color: rgba(255,255,255,0.3);
  letter-spacing: 1px;
}
[data-theme="light"] .page-sep-line { background: rgba(0,0,0,0.1); }
[data-theme="light"] .page-sep-label { color: rgba(0,0,0,0.3); }

/* ── Per-page Exam Button ── */
.page-exam-bar {
  width: 100%;
  max-width: 720px;
  padding: 10px 14px;
  display: flex;
  gap: 8px;
}
.btn-exam-page {
  flex: 1;
  height: 42px;
  border-radius: 10px;
  background: var(--primary);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-exam-page:hover { background: #5A52E0; }
.btn-exam-page.selected {
  background: var(--green);
}
.btn-exam-page.selected:hover { background: #0A9668; }

/* ── Floating Bottom Bar ── */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 10px 14px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bottom-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.page-nav-btn {
  height: 40px;
  padding: 0 16px;
  border-radius: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  white-space: nowrap;
}
.page-nav-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.page-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.page-jump {
  flex: 1;
  height: 40px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  text-align: center;
  font-size: 14px; font-weight: 700;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  font-family: inherit;
}
.page-jump:focus { border-color: var(--primary); }

/* ── Start Exam (selected pages) ── */
.btn-start-exam {
  width: 100%;
  height: 44px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), var(--pink));
  color: #fff;
  font-size: 14px; font-weight: 700;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: opacity 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-start-exam:hover { opacity: 0.9; }
.btn-start-exam:disabled { opacity: 0.4; cursor: not-allowed; }
.selected-count {
  font-size: 11px;
  color: var(--text3);
  text-align: center;
}

/* ── Loading ── */
.pdf-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 16px;
  color: var(--text2);
}
.pdf-loading .spinner {
  width: 44px; height: 44px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.pdf-loading-text { font-size: 13px; }
.pdf-load-progress {
  font-size: 11px; color: var(--text3);
}

/* ── Error ── */
.pdf-error {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 60vh; gap: 12px;
  text-align: center; padding: 24px;
}
.pdf-error-icon  { font-size: 52px; }
.pdf-error-title { font-size: 16px; font-weight: 700; color: var(--text2); }
.pdf-error-text  { font-size: 12px; color: var(--text3); line-height: 1.6; max-width: 280px; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: calc(130px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--card);
  border: 1px solid var(--border);
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 13px; font-weight: 600;
  opacity: 0; transition: all 0.3s;
  z-index: 300; white-space: nowrap;
  box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Max-width centering for desktop ── */
@media (min-width: 768px) {
  .viewer-header, .bottom-bar {
    max-width: 720px;
    left: 50%; transform: translateX(-50%);
    right: auto; width: 720px;
  }
  .viewer-back:hover { background: var(--card-hover); }
}
</style>
</head>
<body>

<!-- ══ VIEWER HEADER ══ -->
<header class="viewer-header">
  <button class="viewer-back" onclick="goBack()" aria-label="পেছনে">←</button>
  <div class="viewer-title" id="viewerTitle">PDF লোড হচ্ছে...</div>
  <div class="viewer-page-badge" id="pageBadge">—</div>
</header>

<!-- ══ PDF RENDER AREA ══ -->
<div class="pdf-area" id="pdfArea">
  <div class="pdf-loading" id="loadingState">
    <div class="spinner"></div>
    <div class="pdf-loading-text">PDF লোড হচ্ছে...</div>
    <div class="pdf-load-progress" id="loadProgress"></div>
  </div>
</div>

<!-- ══ BOTTOM BAR ══ -->
<div class="bottom-bar" id="bottomBar" style="display:none">
  <!-- Page navigation -->
  <div class="bottom-bar-row">
    <button class="page-nav-btn" id="btnPrev" onclick="jumpToPage(currentPage - 1)">← আগে</button>
    <input
      type="number"
      class="page-jump"
      id="pageInput"
      min="1"
      onchange="jumpToPage(parseInt(this.value))"
      aria-label="পৃষ্ঠা নম্বর"
    >
    <button class="page-nav-btn" id="btnNext" onclick="jumpToPage(currentPage + 1)">পরে →</button>
  </div>
  <!-- Selected page count -->
  <div class="selected-count" id="selectedCount" style="display:none"></div>
  <!-- Start exam with selected pages -->
  <button class="btn-start-exam" id="btnStartExam" onclick="startExam()" disabled>
    📝 নির্বাচিত page থেকে Exam দাও
  </button>
</div>

<!-- ══ TOAST ══ -->
<div class="toast" id="toast"></div>

<!-- PDF.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script>
// ── PDF.js worker ──
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── URL Params ──
const params       = new URLSearchParams(location.search);
const PDF_ID       = params.get('pdf_id')       || '';
const PDF_NAME     = params.get('name')          || 'PDF';
const CHAPTER_ID   = params.get('chapter_id')   || '';
const CHAPTER_NAME = params.get('chapter_name') || '';
const SUBJECT_NAME = params.get('subject_name') || '';
const SUBJECT_ICON = params.get('icon')         || '📚';
const TOTAL_PAGES  = parseInt(params.get('pages') || '0', 10);

// ── State ──
let pdfDoc       = null;
let currentPage  = 1;
let totalPages   = 0;
let selectedPages = new Set();        // pages selected for exam (max 5)
const MAX_SELECT = CONFIG.maxPageSelect || 5;

// ── Toast ──
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ── Back ──
function goBack() {
  if (document.referrer && document.referrer.includes(location.hostname)) {
    history.back();
  } else {
    const q = new URLSearchParams({
      chapter_id: CHAPTER_ID,
      name: CHAPTER_NAME,
      subject_name: SUBJECT_NAME,
      icon: SUBJECT_ICON,
    });
    window.location.href = `pdfs.html?${q}`;
  }
}

// ── Render a single page onto canvas ──
async function renderPage(pageNum) {
  const page     = await pdfDoc.getPage(pageNum);
  const viewport = page.getViewport({ scale: window.devicePixelRatio >= 2 ? 2 : 1.5 });

  const canvas  = document.createElement('canvas');
  const ctx     = canvas.getContext('2d');
  canvas.width  = viewport.width;
  canvas.height = viewport.height;

  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas;
}

// ── Build per-page exam button ──
function buildExamBar(pageNum) {
  const bar     = document.createElement('div');
  bar.className = 'page-exam-bar';

  const btn     = document.createElement('button');
  btn.className = 'btn-exam-page';
  btn.id        = `examBtn_${pageNum}`;
  btn.onclick   = () => togglePageSelect(pageNum);
  updateExamBtnLabel(btn, pageNum);

  bar.appendChild(btn);
  return bar;
}

function updateExamBtnLabel(btn, pageNum) {
  const sel = selectedPages.has(pageNum);
  btn.className = sel ? 'btn-exam-page selected' : 'btn-exam-page';
  btn.innerHTML = sel
    ? `✅ পৃষ্ঠা ${pageNum} নির্বাচিত — বাদ দাও`
    : `📝 পৃষ্ঠা ${pageNum} এর MCQ Exam দাও`;
}

// ── Toggle page selection for exam ──
function togglePageSelect(pageNum) {
  if (selectedPages.has(pageNum)) {
    selectedPages.delete(pageNum);
  } else {
    if (selectedPages.size >= MAX_SELECT) {
      showToast(`সর্বোচ্চ ${MAX_SELECT}টি page একসাথে নির্বাচন করা যাবে`);
      return;
    }
    selectedPages.add(pageNum);
  }

  const btn = document.getElementById(`examBtn_${pageNum}`);
  if (btn) updateExamBtnLabel(btn, pageNum);

  updateExamControls();
}

function updateExamControls() {
  const count = selectedPages.size;
  const sel   = document.getElementById('selectedCount');
  const start = document.getElementById('btnStartExam');

  if (count > 0) {
    sel.style.display  = 'block';
    sel.textContent    = `${count}টি page নির্বাচিত (সর্বোচ্চ ${MAX_SELECT}টি)`;
    start.disabled     = false;
    start.innerHTML    = `📝 ${count}টি page থেকে Exam দাও`;
  } else {
    sel.style.display  = 'none';
    start.disabled     = true;
    start.innerHTML    = '📝 নির্বাচিত page থেকে Exam দাও';
  }
}

// ── Start Exam ──
function startExam() {
  if (!selectedPages.size) return;
  const pages = Array.from(selectedPages).sort((a, b) => a - b).join(',');
  const q = new URLSearchParams({
    pdf_id:       PDF_ID,
    pdf_name:     PDF_NAME,
    pages,
    chapter_id:   CHAPTER_ID,
    chapter_name: CHAPTER_NAME,
    subject_name: SUBJECT_NAME,
    icon:         SUBJECT_ICON,
  });
  window.location.href = `exam.html?${q}`;
}

// ── Page navigation ──
function jumpToPage(n) {
  const target = Math.max(1, Math.min(n, totalPages));
  if (target === currentPage) return;
  currentPage = target;

  const el = document.getElementById(`pageWrap_${target}`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  updateNavControls();
}

function updateNavControls() {
  document.getElementById('pageBadge').textContent  = `${currentPage} / ${totalPages}`;
  document.getElementById('pageInput').value        = currentPage;
  document.getElementById('btnPrev').disabled       = currentPage <= 1;
  document.getElementById('btnNext').disabled       = currentPage >= totalPages;
}

// ── Observe page visibility (update currentPage on scroll) ──
function setupPageObserver() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const n = parseInt(e.target.dataset.page, 10);
        if (n && n !== currentPage) {
          currentPage = n;
          updateNavControls();
        }
      }
    });
  }, { threshold: 0.4 });

  document.querySelectorAll('.page-wrap').forEach(el => observer.observe(el));
}

// ── Load and render PDF ──
async function loadPdf() {
  if (!PDF_ID) {
    showError('pdf_id নেই — সঠিক URL দিয়ে আসুন');
    return;
  }

  document.getElementById('viewerTitle').textContent = PDF_NAME;

  // Fetch the actual PDF URL from the Worker
  let pdfUrl;
  try {
    const headers = Auth.isLoggedIn() ? Auth.headers() : {};
    const res     = await fetch(`${CONFIG.workerUrl}/api/pdf-url?pdf_id=${PDF_ID}`, { headers });
    if (!res.ok) throw new Error(`${res.status}`);
    const data    = await res.json();
    pdfUrl        = data.url;
    if (!pdfUrl) throw new Error('URL পাওয়া যায়নি');
  } catch (err) {
    showError(`PDF URL লোড করতে সমস্যা: ${err.message}`);
    return;
  }

  // Load PDF with pdf.js
  const loadingTask = pdfjsLib.getDocument({ url: pdfUrl, cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/', cMapPacked: true });

  loadingTask.onProgress = ({ loaded, total }) => {
    if (total) {
      const pct = Math.round((loaded / total) * 100);
      document.getElementById('loadProgress').textContent = `${pct}%`;
    }
  };

  try {
    pdfDoc     = await loadingTask.promise;
    totalPages = pdfDoc.numPages;
  } catch (err) {
    showError(`PDF খুলতে সমস্যা: ${err.message}`);
    return;
  }

  // Remove loading state, show bottom bar
  document.getElementById('loadingState').remove();
  document.getElementById('bottomBar').style.display = 'flex';
  document.getElementById('pageInput').max = totalPages;
  updateNavControls();
  updateExamControls();

  const area = document.getElementById('pdfArea');

  // Render pages progressively
  for (let i = 1; i <= totalPages; i++) {
    // Separator
    if (i > 1) {
      const sep = document.createElement('div');
      sep.className = 'page-separator';
      sep.innerHTML = `<div class="page-sep-line"></div><div class="page-sep-label">পৃষ্ঠা ${i}</div><div class="page-sep-line"></div>`;
      area.appendChild(sep);
    }

    // Page wrapper
    const wrap     = document.createElement('div');
    wrap.className = 'page-wrap';
    wrap.id        = `pageWrap_${i}`;
    wrap.dataset.page = i;

    // Placeholder while page renders
    wrap.style.minHeight = '400px';
    wrap.style.background = '#222';
    area.appendChild(wrap);

    // Per-page exam button
    area.appendChild(buildExamBar(i));

    // Render asynchronously (non-blocking)
    renderPage(i).then(canvas => {
      wrap.style.minHeight = '';
      wrap.style.background = '';
      wrap.appendChild(canvas);
    }).catch(() => {
      wrap.innerHTML = `<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.3);font-size:12px">পৃষ্ঠা ${i} লোড হয়নি</div>`;
    });
  }

  // Set up scroll observer after a short delay
  setTimeout(setupPageObserver, 800);
}

// ── Error display ──
function showError(msg) {
  document.getElementById('loadingState').remove();
  document.getElementById('pdfArea').innerHTML = `
    <div class="pdf-error">
      <div class="pdf-error-icon">📄</div>
      <div class="pdf-error-title">PDF খোলা যায়নি</div>
      <div class="pdf-error-text">${escHtml(msg)}</div>
      <button class="btn btn-outline" style="margin-top:4px" onclick="location.reload()">↻ আবার চেষ্টা করুন</button>
    </div>`;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Boot ──
document.addEventListener('DOMContentLoaded', () => {
  Theme.init();
  loadPdf();
});
</script>
</body>
</html>
