name = "atlaspro-db"
main = "workers/main-worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database — replace YOUR_D1_DATABASE_ID with the actual ID from Cloudflare dashboard
# Get it with: wrangler d1 list
[[d1_databases]]
binding = "DB"
database_name = "atlaspro"
database_id = "4b5de415-f0ba-4fd3-95f2-ee95f2da46d0"

# R2 Bucket — enable R2 on your Cloudflare account first, then uncomment:
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "atlaspro-files"

